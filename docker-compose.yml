version: '3.9'

services:

  sql-server-db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: sql-server-db
    environment:
      SA_PASSWORD: "Password123!"
      ACCEPT_EULA: "Y"
    ports:
      - "1433:1433"
    networks:
      - glms-network

  glms-backend-api:
    build:
      context: ./TechMoveCRM.API
      dockerfile: Dockerfile
    container_name: glms-backend-api
    depends_on:
      - sql-server-db
    environment:
      - ASPNETCORE_URLS=http://+:80
    ports:
      - "7001:80"
    networks:
      - glms-network

  glms-frontend-web:
    build:
      context: ./TechMoveCRM
      dockerfile: Dockerfile
    container_name: glms-frontend-web
    depends_on:
      - glms-backend-api
    environment:
      - ASPNETCORE_URLS=http://+:80
    ports:
      - "7002:80"
    networks:
      - glms-network

networks:
  glms-network:
    driver: bridge